name: Dependency updates

on:
  schedule:
    - cron: "0 0 * * 1" # Mondays
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm update --legacy-peer-deps
      - run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "dependabot[bot]"
            git config user.email "dependabot@example.com"
            git checkout -b deps/auto-update
            git add -A
            git commit -m "chore(deps): weekly auto-update"
            git push origin deps/auto-update
            gh pr create --title "Weekly dependency update" --body "Auto-generated by Dependabot workflow." --base main --head deps/auto-update
          else
            echo "No updates available."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
