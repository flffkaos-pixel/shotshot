name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ponytail: cancel previous runs on same PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ----------------------------------------------------------------------
  # 1. TypeScript + build
  # ----------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint 2>/dev/null || echo "no lint script (skipping)"

      - name: Build
        run: npm run build

      - name: Upload .next
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 1

  # ----------------------------------------------------------------------
  # 2. e2e (Playwright)
  # ----------------------------------------------------------------------
  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download .next
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production server in background
        run: |
          nohup npx next start -p 3000 > /tmp/next.log 2>&1 &
          sleep 5
          curl -s -o /dev/null -w "Server: %{http_code}\n" http://127.0.0.1:3000/ || true

      - name: Run e2e tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_NO_SERVER: "1"
        run: npx playwright test --reporter=line

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 3

  # ----------------------------------------------------------------------
  # 3. Webhook signature test
  #    ponytail: smoke test that the webhook route rejects unsigned payloads
  #    and 200s on signed (if PayPal sandbox creds are configured).
  # ----------------------------------------------------------------------
  webhook-smoke:
    name: Webhook smoke
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download .next
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/

      - name: Start server
        run: |
          nohup npx next start -p 3000 > /tmp/next.log 2>&1 &
          sleep 5

      - name: Send unsigned webhook (should fail 400)
        run: |
          curl -s -X POST http://127.0.0.1:3000/api/paypal/webhook \
            -H "Content-Type: application/json" \
            -d '{"id":"WH-TEST","event_type":"BILLING.SUBSCRIPTION.ACTIVATED","resource":{"id":"I-TEST"}}' \
            -w "\nstatus: %{http_code}\n" \
            -o /tmp/resp.json
          cat /tmp/resp.json
          # Must contain ok:false
          if ! grep -q '"ok":false' /tmp/resp.json; then
            echo "FAIL: webhook should reject unsigned payload"
            exit 1
          fi
          echo "PASS"

      - name: Send each test payload (unsigned)
        run: |
          for f in tests/webhooks/*.json; do
            code=$(curl -s -X POST http://127.0.0.1:3000/api/paypal/webhook \
              -H "Content-Type: application/json" \
              -d "@$f" \
              -w "%{http_code}" -o /dev/null)
            echo "$f: HTTP $code"
            # unsigned payload should always 400
            if [ "$code" != "400" ]; then
              echo "FAIL: expected 400 for $f, got $code"
              exit 1
            fi
          done
          echo "PASS — all unsigned payloads correctly rejected"

  # ----------------------------------------------------------------------
  # 4. (Optional) Real PayPal simulation if creds available
  #    Skip this job if secrets are not configured.
  # ----------------------------------------------------------------------
  webhook-realsim:
    name: Webhook real PayPal sim
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    if: ${{ env.PAYPAL_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      - name: Start server
        run: |
          nohup npx next start -p 3000 > /tmp/next.log 2>&1 &
          sleep 5
      - name: Send real signed webhook via PayPal simulator
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          WEBHOOK_URL: http://127.0.0.1:3000/api/paypal/webhook
        run: |
          for f in tests/webhooks/0[1-5]*.json; do
            echo "--- $f ---"
            node tests/webhooks/simulate.mjs "$f" || echo "FAILED: $f"
          done

  # ----------------------------------------------------------------------
  # 5. Health check
  # ----------------------------------------------------------------------
  health:
    name: Health check
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      - name: Start server
        run: |
          nohup npx next start -p 3000 > /tmp/next.log 2>&1 &
          sleep 5
      - name: Verify health endpoint
        run: |
          code=$(curl -s -w "%{http_code}" -o /tmp/health.json http://127.0.0.1:3000/api/health)
          echo "Health status: $code"
          echo "Body:"
          cat /tmp/health.json
          # Health is 200 or 503 depending on env, both are valid responses
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then
            echo "FAIL: unexpected health status"
            exit 1
          fi
          echo "PASS"
