name = "shotshot"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# ponytail: Cloudflare Pages + Next.js via @cloudflare/next-on-pages
# Build command: npx @cloudflare/next-on-pages build
# Or use the Cloudflare dashboard's "Next.js" framework preset.

[build]
command = "npx @cloudflare/next-on-pages@1 build"

# ponytail: cron triggers replace Vercel Cron. Runs at 03:00 UTC daily.
# Calls /api/cron/daily with the secret.
[[triggers.crons]]
cron = "0 3 * * *"
# Note: Pages Cron Triggers invoke a Pages Function at the configured path.

# ponytail: R2 binding for static assets (e.g. uploaded screenshots).
# Add via dashboard: R2 > buckets > shotshot > Settings > Public access.
# Bind to env R2_PUBLIC_URL.

# ponytail: KV / D1 / Durable Objects can be added here as needed.
# Currently we use Supabase for DB, so no extra bindings required.
