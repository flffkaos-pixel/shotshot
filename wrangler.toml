name = "shotshot"
main = ".open-next/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# ponytail: NOTE — do NOT add [alias] here. It breaks OpenNext's esbuild alias plugin
# ("Invalid alias name" errors). Handle optional deps (critters) by installing them instead.

# ponytail: OpenNext Cloudflare adapter — deploys Next.js to Workers + static assets.
# Build: npx opennextjs-cloudflare build
# Deploy: npx opennextjs-cloudflare deploy (or wrangler deploy)

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ponytail: Cloudflare Cron Triggers — daily expiry cleanup + renewal warnings.
# Only works on Workers (which is what OpenNext deploys to). Runs at 03:00 UTC.
[triggers]
crons = ["0 3 * * *"]

# ponytail: R2 binding for uploaded screenshots (when you enable R2).
# Uncomment and fill in after creating the bucket:
# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "shotshot"

# ponytail: env vars are managed via `wrangler secret put` or dashboard.
# Required: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
# PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, PAYPAL_SUBSCRIPTION_PLAN_ID, PAYPAL_WEBHOOK_ID,
# RESEND_API_KEY, CRON_SECRET, ADMIN_SECRET
